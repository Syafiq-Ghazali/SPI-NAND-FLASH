[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spi-nand"
version = "0.1.0"
description = "Serial client for the SPI NAND firmware"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
spi-nand = "spi_nand.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spi_nand*"]
